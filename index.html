<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Fondo con 2 Astronautas y color al pasar mouse</title>
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;

    background-color: black;
    background-image: url('estrellas.jpg');
    background-repeat: repeat;
    background-size: 40% 40%;
    background-position: 0 0;

    display: flex;
    justify-content: center;
    align-items: center;

    animation: moverFondo 60s linear infinite;
  }

  @keyframes moverFondo {
    from {
      background-position: 0 0;
    }
    to {
      background-position: 100% 0;
    }
  }

  .astronautas {
    display: flex;
    gap: 40px;
    position: relative;
    z-index: 10;
  }

  .astronauta-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .astronauta {
    width: 250px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .astronauta:hover {
    transform: translateY(-10px);
  }

  .color-indicator {
    margin-top: 10px;
    width: 250px;
    height: 20px;
    background-color: transparent;
    border-radius: 5px;
    transition: background-color 0.3s ease;
  }

  /* Mostrar color al pasar el mouse */
  .astronauta-container:hover .color-indicator {
    background-color: red; /* Por defecto, rojo para el primero */
  }

  /* Para el segundo astronauta, que el color sea celeste */
  .astronauta-container:nth-child(2):hover .color-indicator {
    background-color: #00bfff;
  }
</style>
</head>
<body>
  <div class="astronautas">
    <div class="astronauta-container">
      <img src="astronauta.png" alt="Astronauta 1" class="astronauta" />
      <div class="color-indicator"></div>
    </div>
    <div class="astronauta-container">
      <img src="astronauta.png" alt="Astronauta 2" class="astronauta" />
      <div class="color-indicator"></div>
    </div>
  </div>
</body>
</html>
